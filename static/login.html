<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIRAS | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="container">

<div class="left-panel">

<div class="overlay"></div>

<div class="content">

<h1>Labour Inspection Risk Assessment System</h1>

<p>
AI-powered decision support for smarter, faster and more effective labour inspections.
</p>

<div class="features">

<div class="feature">
<i class="fa-solid fa-shield-halved"></i>
<span>Secure Government Platform</span>
</div>

<div class="feature">
<i class="fa-solid fa-brain"></i>
<span>AI Risk Prediction</span>
</div>

<div class="feature">
<i class="fa-solid fa-chart-line"></i>
<span>Inspection Analytics</span>
</div>

</div>

</div>

</div>

<div class="right-panel">

<div class="login-card">

<div class="logo"><img class="liras-brand-logo" src="assets/liras-logo.png" alt="LIRAS logo"><span>LIRAS</span></div>

<h2>LIRAS</h2>

<p>Department of Labour</p>

</div>

<form id="loginForm">

<div class="input-group">

<label>Email</label>

<div class="input">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
placeholder="Enter your email"
required>

</div>

</div>

<div class="input-group">

<label>Password</label>

<div class="input">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Enter your password"
required>

<i class="fa-solid fa-eye toggle" id="togglePassword"></i>

</div>

</div>

<div class="options">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">Forgot Password?</a>

</div>
<a href="dashboard.html">
<button class="login-btn">

Sign In
</a>
</button>

</form>

<div class="footer">

© 2026 Department of Labour, Bhutan

</div>

</div>

</div>

</div>

<script src="login.js"></script>

</body>
</html>
